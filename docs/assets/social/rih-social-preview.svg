<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Registry Intelligence Hub</title>
  <desc id="desc">Evidence-backed intelligence for ICANN gTLD rounds</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1422"/>
      <stop offset="45%" stop-color="#102033"/>
      <stop offset="100%" stop-color="#0c1a2c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.25" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#2bb673" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#2bb673" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2bb673" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ea2c4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="920" cy="220" rx="380" ry="210" fill="url(#glow)"/>

  <!-- registry-network motif (decorative, no stats) -->
  <g stroke="#6f93b5" stroke-opacity="0.38" stroke-width="1.4" fill="none">
    <path d="M760 120 L880 175 L1010 130 L1120 200"/>
    <path d="M810 300 L920 235 L1045 285 L1140 230"/>
    <path d="M880 175 L920 235 L1010 130"/>
    <path d="M920 235 L1010 330 L1120 200"/>
    <path d="M760 120 L810 300"/>
  </g>
  <g fill="#3ecf9a">
    <circle cx="760" cy="120" r="5"/>
    <circle cx="880" cy="175" r="6"/>
    <circle cx="1010" cy="130" r="5"/>
    <circle cx="1120" cy="200" r="5.5"/>
    <circle cx="810" cy="300" r="4.5"/>
    <circle cx="920" cy="235" r="7"/>
    <circle cx="1045" cy="285" r="5"/>
    <circle cx="1140" cy="230" r="4.5"/>
    <circle cx="1010" cy="330" r="5"/>
  </g>
  <g fill="#9fb9d1" fill-opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="888" y="162">.app</text>
    <text x="928" y="222">.brand</text>
    <text x="1020" y="118">.idn</text>
    <text x="1055" y="275">.geo</text>
  </g>

  <rect x="0" y="0" width="8" height="630" fill="#2bb673"/>

  <!-- copy: brand-first for LinkedIn thumbnail legibility -->
  <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="168" font-size="18" letter-spacing="0.22em" fill="#3ecf9a" font-weight="600">INDEPENDENT RESEARCH DASHBOARD</text>
    <text x="64" y="250" font-size="54" font-weight="700" fill="#f3f7fb">Registry Intelligence Hub</text>
    <text x="64" y="318" font-size="28" font-weight="600" fill="#d7e6f4">Evidence-backed intelligence</text>
    <text x="64" y="358" font-size="28" font-weight="600" fill="#d7e6f4">for ICANN gTLD rounds</text>
    <text x="64" y="430" font-size="16" fill="#a9bfd6" letter-spacing="0.03em">
      Applications &#183; Competitive Landscape &#183; Contention &#183; Registry Market &#183; Historical Comparisons
    </text>
  </g>

  <g stroke="#7ea2c4" stroke-opacity="0.35" stroke-width="1">
    <path d="M64 500 h48 M64 500 v-18"/>
    <path d="M1136 500 h-48 M1136 500 v-18"/>
  </g>
</svg>
