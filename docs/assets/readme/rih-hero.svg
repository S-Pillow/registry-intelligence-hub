<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Registry Intelligence Hub</title>
  <desc id="desc">Evidence-backed intelligence for ICANN gTLD rounds</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1422"/>
      <stop offset="45%" stop-color="#102033"/>
      <stop offset="100%" stop-color="#0c1a2c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2bb673" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#2bb673" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2bb673" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7ea2c4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <ellipse cx="1180" cy="180" rx="420" ry="220" fill="url(#glow)"/>

  <!-- network / registry motif -->
  <g stroke="#6f93b5" stroke-opacity="0.35" stroke-width="1.25" fill="none">
    <path d="M980 110 L1120 170 L1280 120 L1410 190"/>
    <path d="M1040 280 L1180 220 L1330 260 L1450 210"/>
    <path d="M1120 170 L1180 220 L1280 120"/>
    <path d="M1180 220 L1280 310 L1410 190"/>
    <path d="M980 110 L1040 280"/>
  </g>
  <g fill="#3ecf9a">
    <circle cx="980" cy="110" r="4.5"/>
    <circle cx="1120" cy="170" r="5.5"/>
    <circle cx="1280" cy="120" r="4.5"/>
    <circle cx="1410" cy="190" r="5"/>
    <circle cx="1040" cy="280" r="4"/>
    <circle cx="1180" cy="220" r="6"/>
    <circle cx="1330" cy="260" r="4.5"/>
    <circle cx="1450" cy="210" r="4"/>
    <circle cx="1280" cy="310" r="4.5"/>
  </g>
  <g fill="#9fb9d1" fill-opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="1128" y="158">.app</text>
    <text x="1188" y="208">.brand</text>
    <text x="1290" y="108">.idn</text>
    <text x="1340" y="252">.geo</text>
  </g>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="500" fill="#2bb673"/>

  <!-- copy -->
  <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#f3f7fb">
    <text x="72" y="168" font-size="18" letter-spacing="0.28em" fill="#3ecf9a" font-weight="600">REGISTRY INTELLIGENCE HUB</text>
    <text x="72" y="230" font-size="42" font-weight="700">Evidence-backed intelligence</text>
    <text x="72" y="282" font-size="42" font-weight="700">for ICANN gTLD rounds</text>
    <text x="72" y="340" font-size="16" fill="#a9bfd6" letter-spacing="0.04em">
      Applications · Organizations · Contention · Change Intelligence · Registry Market · Historical Intelligence
    </text>
  </g>

  <!-- corner measurement ticks -->
  <g stroke="#7ea2c4" stroke-opacity="0.35" stroke-width="1">
    <path d="M72 400 h48 M72 400 v-18"/>
    <path d="M1528 400 h-48 M1528 400 v-18"/>
  </g>
</svg>
